{% extends 'myapp/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4" style="max-width: 500px; width: 100%;">
        <h2 class="text-center mb-4">Add Player</h2>
        <form method="POST" action="{% url 'add_player' %}">
            {% csrf_token %}
            
            <!-- Player Name Field -->
            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label">Player Name</label>
                {{ form.name }}
            </div>

            <!-- Age Field -->
            <div class="mb-3">
                <label for="{{ form.age.id_for_label }}" class="form-label">Age</label>
                {{ form.age }}
            </div>

            <!-- Team Field -->
            <div class="mb-3">
                <label for="{{ form.team.id_for_label }}" class="form-label">Team</label>
                {{ form.team }}
            </div>

            <!-- Position Field -->
            <div class="mb-3">
                <label for="{{ form.position.id_for_label }}" class="form-label">Position</label>
                {{ form.position }}
            </div>

            <button type="submit" class="btn btn-primary w-100">Add Player</button>
        </form>
    </div>
</div>
{% endblock %}
