{% extends 'myapp/base.html' %}

{% block content %}
<style>
    .form-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        max-width: 600px;
        margin: auto;
    }

    .form-card:hover {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .form-title {
        font-weight: 700;
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 25px;
        color: #333;
    }

    button[type="submit"] {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 20px;
        font-weight: 600;
        border-radius: 8px;
        transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
        background-color: #218838;
    }

    .messages {
        margin-top: 20px;
        list-style: none;
        padding-left: 0;
        text-align: center;
    }

    .messages li {
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .messages li.success {
        background-color: #d4edda;
        color: #155724;
    }

    .messages li.error {
        background-color: #f8d7da;
        color: #721c24;
    }
</style>

<div class="container mt-5">
    <div class="form-card">
        <h2 class="form-title">Add Stats for {{ player.name }}</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-end">
                <button type="submit">Save Stats</button>
            </div>
        </form>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</div>
{% endblock %}
