{% extends 'myapp/base.html' %}
{% load static %}

{% block title %}Signup{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Signup</h2>

        {% if error_message %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST" onsubmit="validateSignupForm(event)">
            {% csrf_token %}
            
            <div class="mb-3">
                <input type="text" name="username" placeholder="Username" required class="form-control">
            </div>

            <div class="mb-3">
                <input type="email" name="email" placeholder="Email" required class="form-control">
            </div>

            <div class="mb-3">
                <input type="password" name="password1" id="password1" placeholder="Password" required class="form-control">
            </div>

            <div class="mb-3 position-relative">
                <input type="password" name="password2" id="password2" placeholder="Confirm Password" required class="form-control">
                <a href="javascript:void(0);" id="toggle2" onclick="togglePassword('password2', 'toggle2')" class="position-absolute" style="top: 50%; right: 10px; transform: translateY(-50%);">Show</a>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Signup</button>
            </div>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, toggleLinkId) {
        var passwordField = document.getElementById(inputId);
        var toggleLink = document.getElementById(toggleLinkId);
        
        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleLink.textContent = "Hide";
        } else {
            passwordField.type = "password";
            toggleLink.textContent = "Show";
        }
    }

    function validateSignupForm(event) {
        var password1 = document.getElementById("password1").value;
        var password2 = document.getElementById("password2").value;

        if (password1 !== password2) {
            alert("Passwords do not match!");
            event.preventDefault(); // Prevent form submission
        }
    }
</script>

{% endblock %}
