{% extends 'myapp/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="mb-4 text-center">Add Player Stats</h3>
            <form method="POST" class="border p-4 shadow-sm bg-light rounded">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3 text-center">
                        <label for="{{ field.id_for_label }}" class="form-label text-start d-block">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="text-center">
                    <button type="submit" class="btn btn-primary mt-3">Save Stats</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    input, select, textarea {
        width: 75% !important;
        margin: 0 auto;
        display: block;
    }
</style>
{% endblock %}
