{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tournament Organizer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            background-image: url("{% static 'myapp/backgrounds/cricket-bg.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>

   <!-- Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3 animate__animated animate__fadeInDown">
     <div class="container">
       <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">
         Tournament Organizer
       </a>
       <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
         <span class="navbar-toggler-icon"></span>
       </button>

       <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
         <ul class="navbar-nav mb-2 mb-lg-0">
           <li class="nav-item">
             <a class="nav-link px-3" href="{% url 'home' %}">Home</a>
           </li>
           <li class="nav-item">
             <a class="nav-link px-3" href="{% url 'teams' %}">Teams</a>
           </li>
           <li class="nav-item">
             <a class="nav-link px-3" href="{% url 'matches' %}">Matches</a>
           </li>
           <li class="nav-item">
             <a class="nav-link px-3" href="{% url 'player_list' %}">Players</a>
           </li>
           <li class="nav-item">
             <a class="nav-link px-3" href="{% url 'login' %}">Login</a>
           </li>
          
         </ul>
       </div>
     </div>
   </nav>

   <!-- Main Content -->
   <header>
       <div class="container mt-5 pt-5">
           {% block content %}
           {% endblock %}
       </div>
   </header>

   <!-- Bootstrap JS and Popper.js -->
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
   <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
