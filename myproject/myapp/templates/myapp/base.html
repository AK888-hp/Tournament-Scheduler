{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tournament Organizer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2b2f68;">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Tournament Organizer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'teams' %}">Players</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'matches' %}">Matches</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_team' %}">Teams</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light me-3" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
                    {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                    {% else %}
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <header>
        <div class="container mt-5 pt-5">
            {% block content %}
            {% endblock %}
        </div>
    </header>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
