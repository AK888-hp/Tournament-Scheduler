{% extends 'myapp/base.html' %}

{% block content %}
<style>
    .login-card {
        background: #1f2329;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        padding: 3rem 2.5rem;
        color: #e0e0e0;
        user-select: none;
    }

    .login-card:hover {
        transform: scale(1.02);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 1);
    }

    .login-title {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #e0e0e0;
    }

    p {
        margin-bottom: 1rem;
        font-size: 1rem;
    }

    .text-muted {
        color: #bbb;
    }

    .text-danger {
        color: #ff6b6b;
        font-weight: 600;
    }

    .fade-in {
        animation: fadeIn 0.6s ease-in-out forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="container mt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="login-card">
                <h2 class="login-title">Login</h2>
                <p class="text-muted">Login and Signup functionality is currently not available.</p>
                <p class="text-danger">Please check back later or contact the administrator for access.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
